plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.awesomedesk.j_planner'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'

    // 일정 장소 좌표 (MySQL POINT)
    implementation 'org.hibernate.orm:hibernate-spatial'

    // DB
    runtimeOnly 'com.mysql:mysql-connector-j'

    // lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// /api/v1/health에 보여줄 빌드 정보 (버전·빌드 시각 + git 마지막 커밋).
// git 저장소가 아니거나 git이 없으면 커밋 정보만 빠진다.
def lastCommit = { String format ->
    try {
        def out = providers.exec {
            commandLine 'git', 'log', '-1', "--format=${format}"
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        return out ?: null
    } catch (Exception ignored) {
        return null
    }
}

springBoot {
    buildInfo {
        properties {
            def git = [commit: lastCommit('%h'), commitTime: lastCommit('%cI')].findAll { it.value != null }
            additional = git
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

tasks.named('test') {
    useJUnitPlatform()
}
