server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  config:
    import:
      - classpath:/profile/application-local.yml
      - classpath:/profile/application-tst.yml
      - classpath:/profile/application-prd.yml
  profiles:
    active: local
  jackson:
    time-zone: Asia/Seoul

# FE 주소 (CORS). 여러 개면 쉼표로 구분
app:
  cors:
    allowed-origins: http://localhost:3000
