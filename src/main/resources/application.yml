server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  config:
    import:
      # 로컬 비밀 값 (.env, git 제외). 없으면 건너뛴다
      - optional:file:.env[.properties]
      - classpath:/profile/application-local.yml
      - classpath:/profile/application-tst.yml
      - classpath:/profile/application-prd.yml
  profiles:
    active: local
  jackson:
    time-zone: Asia/Seoul
  # 테이블은 Flyway 마이그레이션(db/migration/V*.sql)으로 만들고 바꾼다.
  # 이미 테이블이 있는데 적용 기록이 없는 DB(예전 로컬 DB, local-reset.sql로 만든 DB)는 V1로 기록하고 시작한다.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    placeholders:
      # V2: 기존 1인 데이터를 옮길 admin 계정 이메일 (07-db-design.md 11-5). 저장소에 쓰지 않는다 — 환경 변수 / 로컬 .env
      admin_email: ${JP_ADMIN_EMAIL}

# API 명세 화면: http://localhost:8080/swagger-ui.html
# 명세는 코드에서 만들지 않고 08-openapi.yaml(빌드 때 static/openapi.yaml로 복사)을 그대로 보여준다
springdoc:
  api-docs:
    enabled: true          # swagger-ui 설정(/v3/api-docs/swagger-config)에 필요. 코드 생성 명세는 쓰지 않음
  swagger-ui:
    url: /openapi.yaml
    disable-swagger-default-url: true

# FE 주소 (CORS). 여러 개면 쉼표로 구분
# 관제 (US-41, 07 11-6): Actuator는 앱(8080)과 다른 관리 포트에서만 연다 — health·prometheus만.
# 관리 포트는 사설망에만 (tst·prd는 JP_MANAGEMENT_ADDRESS로 묶는 주소를 정한다). /api/**로는 열지 않는다
management:
  server:
    port: ${JP_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
app:
  # 믿는 프록시 (US-41): 이 주소(CIDR, 쉼표 목록)에서 온 연결만 X-Forwarded-For로 진짜 IP를 정한다 (ClientIp). 로컬은 프록시 없음
  network:
    trusted-proxies: ${JP_TRUSTED_PROXIES:}
  # 요청 제한 Redis 키의 대상 해시 HMAC 비밀 키 (US-41, base64 32바이트 이상). 로컬은 비워 두면 켤 때마다 무작위 — tst·prd는 JP_RATELIMIT_KEY 필수
  ratelimit:
    key: ${JP_RATELIMIT_KEY:}
  # 일기·메모 내용 암호화 키 (US-41, AES-256 = base64 32바이트). 키를 잃으면 되돌릴 수 없다 — tst·prd는 JP_DATA_KEY 필수, 로컬은 application-local.yml
  crypto:
    data-key: ${JP_DATA_KEY:}
  cors:
    allowed-origins: ${JP_CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
  # FE 화면 주소 — 메일 링크(가입 인증 /signup/verify?token=…)에 쓴다 (D-074: 운영 도메인은 설정값으로). tst·prd는 JP_WEB_BASE_URL
  web:
    base-url: ${JP_WEB_BASE_URL:http://localhost:3000}
  # 계정 메일 보내는 주소 (D-074). 지금은 가짜 발송(LoggingAuthMailer) — 실제 발송은 도메인 구입·배포 준비 때
  mail:
    from: ${JP_MAIL_FROM:no-reply@awesomedesk.co.kr}
  # 구글 로그인 (US-36, OpenID Connect). 클라이언트 ID·비밀값은 .env / 환경 변수로만 (저장소에 쓰지 않음).
  # 로컬에서 비워 두면 구글 로그인이 꺼진다 (구글 버튼 → /login?error=GOOGLE_FAILED). tst·prd는 필수.
  # 구글 콘솔에 등록할 redirect URI = <app.web.base-url>/api/v1/auth/google/callback (예: 로컬 http://localhost:3000/api/v1/auth/google/callback)
  auth:
    google:
      client-id: ${JP_GOOGLE_CLIENT_ID:}
      client-secret: ${JP_GOOGLE_CLIENT_SECRET:}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      issuer: https://accounts.google.com
