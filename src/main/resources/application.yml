server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  config:
    import:
      # 로컬 비밀 값 (.env, git 제외). 없으면 건너뛴다
      - optional:file:.env[.properties]
      - classpath:/profile/application-local.yml
      - classpath:/profile/application-tst.yml
      - classpath:/profile/application-prd.yml
  profiles:
    active: local
  jackson:
    time-zone: Asia/Seoul
  # 테이블은 Flyway 마이그레이션(db/migration/V*.sql)으로 만들고 바꾼다.
  # 이미 테이블이 있는데 적용 기록이 없는 DB(예전 로컬 DB, local-reset.sql로 만든 DB)는 V1로 기록하고 시작한다.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    placeholders:
      # V2: 기존 1인 데이터를 옮길 admin 계정 이메일 (07-db-design.md 11-5). 저장소에 쓰지 않는다 — 환경 변수 / 로컬 .env
      admin_email: ${JP_ADMIN_EMAIL}

# API 명세 화면: http://localhost:8080/swagger-ui.html
# 명세는 코드에서 만들지 않고 08-openapi.yaml(빌드 때 static/openapi.yaml로 복사)을 그대로 보여준다
springdoc:
  api-docs:
    enabled: true          # swagger-ui 설정(/v3/api-docs/swagger-config)에 필요. 코드 생성 명세는 쓰지 않음
  swagger-ui:
    url: /openapi.yaml
    disable-swagger-default-url: true

# FE 주소 (CORS). 여러 개면 쉼표로 구분
app:
  cors:
    allowed-origins: ${JP_CORS_ORIGINS:http://localhost:3000}
