---
# 테스트 서버: 접속 정보는 모두 환경 변수로 받는다 (파일·git에 비밀 값을 두지 않는다)
#   JP_DB_URL      예) jdbc:mysql://db-host:3306/jp?useSSL=true&useUnicode=true&connectionTimeZone=Asia/Seoul&preserveInstants=false&sessionVariables=time_zone='%2B09:00'
#   JP_DB_USERNAME, JP_DB_PASSWORD
#   JP_REDIS_HOST, JP_REDIS_PORT, JP_REDIS_USERNAME, JP_REDIS_PASSWORD (US-34 세션)
#   JP_CORS_ORIGINS  FE 주소 (쉼표로 여러 개)
#   JP_WEB_BASE_URL  FE 화면 주소 (메일 링크, 예 https://planner.example.com) — 기본값 없음 (D-074)
#   JP_MAIL_FROM     보내는 주소 (기본 no-reply@awesomedesk.co.kr)
#   JP_TRUSTED_PROXIES  앞단 프록시(Caddy/nginx) 주소 CIDR, 쉼표 목록 (US-41, 예 10.0.0.2/32) — 기본값 없음. 프록시가 없으면 빈 값으로 명시
#   JP_RATELIMIT_KEY  요청 제한 키 HMAC 비밀 키 (US-41, base64 32바이트 이상, 예: openssl rand -base64 32) — 기본값 없음
#   JP_GOOGLE_CLIENT_ID, JP_GOOGLE_CLIENT_SECRET  구글 로그인 OAuth 클라이언트 (US-36) — 기본값 없음
spring:
  config:
    activate:
      on-profile: tst
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${JP_DB_URL}
    username: ${JP_DB_USERNAME}
    password: ${JP_DB_PASSWORD}
  # 세션·요청 제한 (US-34). Redis 접속 정보도 환경 변수로
  data:
    redis:
      host: ${JP_REDIS_HOST}
      port: ${JP_REDIS_PORT:6379}
      username: ${JP_REDIS_USERNAME:}
      password: ${JP_REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
# 메일 링크 주소 (가입 인증 등). 기본값을 두지 않아 빠뜨리면 켜지지 않는다
app:
  network:
    trusted-proxies: ${JP_TRUSTED_PROXIES}
  ratelimit:
    key: ${JP_RATELIMIT_KEY}
  web:
    base-url: ${JP_WEB_BASE_URL}
  # 구글 로그인 (US-36). 기본값을 두지 않아 빠뜨리면 켜지지 않는다
  auth:
    google:
      client-id: ${JP_GOOGLE_CLIENT_ID}
      client-secret: ${JP_GOOGLE_CLIENT_SECRET}
---
