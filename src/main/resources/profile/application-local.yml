---
# 로컬: 요청마다 메서드·경로·상태 코드·처리 시간을 logs/access.YYYY-MM-DD.log에 남긴다 (FE 연결 확인용)
server:
  tomcat:
    accesslog:
      enabled: true
      directory: ${user.dir}/logs
      prefix: access
      suffix: .log
      pattern: '%{yyyy-MM-dd HH:mm:ss}t "%r" %s %{ms}Tms'

spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/jp?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&connectionTimeZone=Asia/Seoul&preserveInstants=false&sessionVariables=time_zone='%2B09:00'
    username: ${JP_DB_USERNAME:jplanner}
    password: ${JP_DB_PASSWORD}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: none

# 로컬 로그인용 계정 준비 (DevAccounts): .env의 JP_DEV_ACCOUNTS=이메일:비밀번호;이메일:비밀번호
# 없는 회원은 만들고, 비밀번호가 없을 때만 정한다. 가입(US-33)·비밀번호 찾기(US-35)가 생기면 지운다
app:
  auth:
    dev-accounts: ${JP_DEV_ACCOUNTS:}
  # 로컬 개발용 일기·메모 암호화 키 (비밀 아님 — 로컬 데이터 전용, 운영 키와 다르게). .env의 JP_DATA_KEY가 있으면 그것
  crypto:
    data-key: ${JP_DATA_KEY:bG9jYWwtZGV2LW9ubHktZGF0YS1rZXktMzItYnl0ZXM=}
---
