spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${JP_TEST_DB_URL:jdbc:mysql://127.0.0.1:3306/jp_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&connectionTimeZone=Asia/Seoul&preserveInstants=false&sessionVariables=time_zone='%2B09:00'}
    username: ${JP_TEST_DB_USERNAME:jplanner}
    password: ${JP_TEST_DB_PASSWORD}

  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    hibernate:
      ddl-auto: none

  # 테스트 DB 테이블은 운영과 같은 Flyway 마이그레이션으로 만든다. 테스트를 시작할 때 비우고(clean) 처음부터 적용한다 (TestFlywayConfig).
  # 데이터는 테스트마다 sql/reset.sql로 비운다
  flyway:
    clean-disabled: false
    placeholders:
      # V2: 기존 데이터를 옮길 admin 계정 이메일 (운영은 JP_ADMIN_EMAIL)
      admin_email: admin@test.local
  config:
    import: optional:file:.env[.properties]
  # 테스트는 Redis 1번 DB를 쓴다. 테스트마다 비우는데(IntegrationTest), 로컬 서버(0번 DB)를 켜 둔 채 돌려도 로그인 세션이 지워지지 않게
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: ${JP_TEST_REDIS_DATABASE:1}
  jackson:
    time-zone: Asia/Seoul

# 메인 application.yml과 같게 (테스트 설정 파일이 메인 것을 대신하므로)
springdoc:
  swagger-ui:
    url: /openapi.yaml
    disable-swagger-default-url: true

app:
  # 믿는 프록시 (US-41). 테스트는 10.0.0.0/8을 프록시로 본다 — Browser.via(...)로 X-Forwarded-For를 붙인다
  network:
    trusted-proxies: 10.0.0.0/8
  # 요청 제한 키 HMAC 비밀 키 (US-41). 테스트용 가짜 값 (운영은 JP_RATELIMIT_KEY)
  ratelimit:
    key: dGVzdC1vbmx5LXJhdGUtbGltaXQta2V5LTMyYnl0ZXMh
  # 일기·메모 암호화 키 (US-41). 테스트용 가짜 값 (운영은 JP_DATA_KEY)
  crypto:
    data-key: dGVzdC1vbmx5LWRhdGEta2V5LWV4YWN0bHktMzJCISE=
  cors:
    allowed-origins: http://localhost:3000
  web:
    base-url: http://localhost:3000
  mail:
    from: no-reply@example.com
  auth:
    hibp:
      enabled: false
